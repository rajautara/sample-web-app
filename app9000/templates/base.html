<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}App 9000{% endblock %}</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7280; --accent:#1f6feb; --line:#e5e7eb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--text); }
    header { background:var(--text); color:#fff; padding:12px 24px; display:flex; justify-content:space-between; align-items:center; }
    header a { color:#fff; text-decoration:none; margin-left:16px; }
    .badge { background:#ffffff22; padding:4px 10px; border-radius:999px; font-size:13px; }
    main { max-width:820px; margin:24px auto; padding:0 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; margin:0 0 4px; }
    .muted { color:var(--muted); font-size:14px; }
    textarea { width:100%; min-height:70px; padding:8px; border:1px solid var(--line); border-radius:6px; font:inherit; }
    button { background:var(--accent); color:#fff; border:0; padding:8px 16px; border-radius:6px; cursor:pointer; font:inherit; }
    button.link { background:none; color:#b42318; padding:0; font-size:13px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); }
    ul.notes { list-style:none; padding:0; margin:0; }
    ul.notes li { padding:10px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; }
  </style>
</head>
<body>
  <header>
    <strong>App 9000</strong>
    <div>
      <span class="badge">{{ g.display_name or g.user }}</span>
      <a href="{{ url_for('index') }}">Utama</a>
      {% if g.is_admin %}<a href="{{ url_for('admin') }}">Admin</a>{% endif %}
    </div>
  </header>
  <main>
    {% if g.user %}
    <section class="card" aria-label="Profil pengguna">
      <h1>{{ g.display_name }}</h1>
      <div class="muted">Domain: {{ g.domain }} · Username: {{ g.username }}</div>
      <div class="muted">Email: {{ g.email or 'Tidak tersedia' }}</div>
    </section>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
